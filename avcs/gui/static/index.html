<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AVCS — AI assistant</title>
<style>
  :root {
    --bg: #0b0e14;
    --panel: #141922;
    --panel-2: #1a212c;
    --line: #232c39;
    --text: #e8eef6;
    --muted: #8b98a9;
    --accent: #6ea8fe;
    --ok: #46d17f;
    --warn: #d8a531;
    --deny: #f2716a;
    --ai: #171e29;
    --me: #2358c9;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.55 ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 11px 18px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header .brand { font-size: 15px; font-weight: 650; letter-spacing: .2px; margin-right: 4px; }
  header .brand span { color: var(--accent); }
  .badge {
    font-size: 11.5px; padding: 3px 9px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--muted); white-space: nowrap;
  }
  .badge.ok { color: var(--ok); border-color: #1d4a2f; }
  .badge.warn { color: var(--warn); border-color: #4c3d13; }
  .badge.deny { color: var(--deny); border-color: #4d2320; }
  .spacer { flex: 1; }

  main {
    display: grid; grid-template-columns: minmax(0, 1fr) 460px;
    height: calc(100vh - 47px);
  }
  @media (max-width: 980px) {
    main { grid-template-columns: 1fr; height: auto; }
    #eyePane { border-right: none; border-bottom: 1px solid var(--line); }
  }

  /* ---- what the assistant sees ---- */
  #eyePane { padding: 18px; overflow: auto; border-right: 1px solid var(--line); min-width: 0; }
  .paneTitle {
    font-size: 11px; text-transform: uppercase; letter-spacing: .09em;
    color: var(--muted); margin: 0 0 9px; font-weight: 650;
  }
  .paneTitle.warn { color: var(--warn); }
  #screenWrap {
    position: relative; display: block; border-radius: 10px; overflow: hidden;
    border: 1px solid var(--line); background: #000; line-height: 0;
  }
  #screen { display: block; width: 100%; height: auto; }
  #overlay { position: absolute; inset: 0; pointer-events: none; }
  .box { position: absolute; border: 2px solid var(--accent); border-radius: 4px; }
  .box .tag {
    position: absolute; top: -20px; left: -2px; font-size: 11px; font-weight: 650;
    background: var(--accent); color: #04101f; padding: 1px 6px; border-radius: 4px;
    white-space: nowrap;
  }
  .box.low { border-color: var(--warn); }
  .box.low .tag { background: var(--warn); }

  #sight {
    margin-top: 14px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 13px 15px;
  }
  #sight .say { font-size: 15px; line-height: 1.5; }
  #sight .say::before { content: "\201C"; color: var(--muted); }
  #sight .say::after { content: "\201D"; color: var(--muted); }
  .metrics { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 11px; }
  .metric {
    font-size: 11.5px; color: var(--muted); border: 1px solid var(--line);
    border-radius: 7px; padding: 4px 9px; background: var(--panel-2);
  }
  .metric b { color: var(--text); font-weight: 600; }
  .metric.flag { border-color: #4c3d13; color: var(--warn); }

  .row { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 13px; }
  .row button {
    padding: 6px 11px; font-size: 12.5px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--panel-2); color: var(--text);
    cursor: pointer;
  }
  .row button:hover { border-color: var(--accent); }
  .row button.on { border-color: var(--accent); color: var(--accent); }

  /* ---- conversation ---- */
  aside { display: flex; flex-direction: column; min-height: 0; background: var(--panel); }
  #chat { flex: 1; overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 11px; }
  .msg { max-width: 94%; padding: 10px 13px; border-radius: 12px; white-space: pre-wrap; word-wrap: break-word; }
  .msg.me { align-self: flex-end; background: var(--me); color: #fff; border-bottom-right-radius: 4px; }
  .msg.ai { align-self: flex-start; background: var(--ai); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .msg.ai.streaming { opacity: .8; }
  .msg.sys { align-self: center; background: transparent; color: var(--muted); font-size: 12.5px; text-align: center; }
  .meta { font-size: 11.5px; color: var(--muted); margin-top: 7px; }
  .meta code { color: var(--text); background: #0e131b; padding: 1px 5px; border-radius: 4px; }

  #ask { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
  #q {
    flex: 1; min-width: 0; padding: 11px 13px; border-radius: 10px; font-size: 15px;
    border: 1px solid var(--line); background: #0d1119; color: var(--text);
  }
  #q:focus { outline: none; border-color: var(--accent); }
  #ask button {
    padding: 11px 15px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--text); cursor: pointer; font-size: 15px;
  }
  #ask button:hover { border-color: var(--accent); }
  #ask button:disabled { opacity: .5; cursor: default; }
  #mic.rec { border-color: var(--deny); color: var(--deny); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
</style>
</head>
<body>
<header>
  <div class="brand">AVCS <span>assistant</span></div>
  <span class="badge" id="bBrain">brain …</span>
  <span class="badge" id="bMouth">mouth …</span>
  <span class="badge" id="bEars">ears …</span>
  <span class="badge" id="bEyes">eyes …</span>
  <span class="badge" id="bHand">hand: —</span>
  <span class="badge" id="bMotion">motion: —</span>
  <span class="badge" id="bMemory">memory: —</span>
  <span class="badge" id="bWatch">watch: —</span>
  <span class="badge" id="bListen">listening: off</span>
  <span class="spacer"></span>
  <span class="badge" id="bFps">— fps</span>
  <span class="badge" id="bRead">— ms/frame</span>
</header>

<main>
  <section id="eyePane">
    <p class="paneTitle" id="paneTitle">what the assistant sees — pure pixels, no OCR</p>
    <div id="screenWrap">
      <img id="screen" alt="the live screen" />
      <div id="overlay"></div>
    </div>
    <div id="sight">
      <div class="say" id="say">waiting for the first frame…</div>
      <div class="metrics" id="metrics"></div>
    </div>
    <div class="row" id="scenes"></div>
  </section>

  <aside>
    <div id="chat"></div>
    <form id="ask">
      <input id="q" type="text" autocomplete="off"
             placeholder="boliye — jaise &quot;mujhe kya karna hai?&quot;" />
      <button type="button" id="mic" title="hold to talk">🎙</button>
      <button type="submit" id="send">Bhejo</button>
    </form>
  </aside>
</main>

<script>
"use strict";
const $ = (s) => document.querySelector(s);
const img = $("#screen");
const overlay = $("#overlay");
let lastT = performance.now(), fps = 0;
let earsEnabled = true;

/* ---------------------------------------------------------------- */
/* Header: capabilities, reported honestly.                          */
/* ---------------------------------------------------------------- */
async function loadCaps() {
  try {
    const c = await (await fetch("/api/capabilities")).json();
    const hasKey = c.brain_has_key === true;
    const b = $("#bBrain");
    b.textContent = "brain: " + (hasKey ? "LLM" : "rule fallback (no key)");
    b.className = "badge " + (hasKey ? "ok" : "warn");

    const mouth = c.mouth && c.mouth !== "null" ? c.mouth : "off";
    $("#bMouth").textContent = "mouth: " + mouth;
    $("#bMouth").className = "badge " + (mouth !== "off" ? "ok" : "warn");

    const ears = c.ears && c.ears !== "null" ? c.ears : "off";
    earsEnabled = c.ears !== "null" && c.ears_available === true;
    $("#bEars").textContent = "ears: " + ears;
    $("#bEars").className = "badge " + (ears !== "off" ? "ok" : "warn");
    $("#mic").disabled = !earsEnabled;
    if (!earsEnabled) $("#bListen").textContent = "listening: off (text mode)";

    $("#bEyes").textContent = "eyes: " + (c.eyes || "?");
    $("#bEyes").className = "badge " + (c.eyes === "ScenePerception" ? "ok" : "warn");

    // Actuation is reported as what the machine can actually do, not what was
    // requested: "live" only when a real hand is attached.
    const act = c.actuation || "virtual";
    const hand = c.hand ? c.hand : null;
    const bh = $("#bHand");
    if (act === "live") {
      bh.textContent = "hand: live" + (hand ? " (" + hand + ")" : "");
      bh.className = "badge ok";
    } else if (act === "live-unavailable") {
      bh.textContent = "hand: live requested, none available";
      bh.className = "badge deny";
    } else {
      bh.textContent = "hand: virtual (moves no cursor)";
      bh.className = "badge warn";
    }

    // Memory is a capability the assistant either has or does not. Saying "on"
    // when no store is attached would be the same overclaim as a fake hand.
    const bm = $("#bMemory");
    if (bm) {
      const on = c.memory === true;
      bm.textContent = "memory: " + (on ? "on" : "off");
      bm.className = "badge " + (on ? "ok" : "warn");
    }

    // Proactive awareness: whether the assistant watches the screen and can
    // speak first. Reported from the real loop, never a cosmetic "on".
    const bw = $("#bWatch");
    if (bw) {
      const on = c.proactive === true;
      bw.textContent = "watch: " + (on ? "on" : "off");
      bw.className = "badge " + (on ? "ok" : "warn");
    }

    // Motion: how the pointer travels. "neuromuscular" means the hand plans a
    // human trajectory instead of teleporting. Reported from the hand itself,
    // not from a flag the page set, so a build without the servo says so.
    const bmo = $("#bMotion");
    if (bmo) {
      const motion = c.motion || (hand && hand.indexOf("servo") === 0 ? "neuromuscular" : "teleport");
      bmo.textContent = "motion: " + motion;
      bmo.className = "badge " + (motion === "neuromuscular" ? "ok" : "warn");
    }

    // Capture provenance: the pane says "live screen" only when the pixels
    // really came off the screen. A synthetic desktop, or an eye whose capture
    // backend is missing (which yields a flat grey buffer), is labelled so the
    // view is never a claim the machine cannot back up.
    const pt = $("#paneTitle");
    if (pt) {
      const live = c.capture === "live";
      pt.textContent = live
        ? "what the assistant sees — live screen, pure pixels, no OCR"
        : "what the assistant sees — synthetic view, pure pixels, no OCR";
      pt.className = "paneTitle " + (live ? "" : "warn");
    }
  } catch (e) { /* cosmetic */ }
}

/* ---------------------------------------------------------------- */
/* The eye pane: one state object per frame from /api/stream.        */
/* ---------------------------------------------------------------- */
function renderSight(state) {
  if (state.frame_size && state.frame_size[0]) {
    const [w, h] = state.frame_size;
    if (img.dataset.seq !== String(state.seq)) {
      img.dataset.seq = String(state.seq);
      img.src = "/api/frame.png?seq=" + state.seq;
    }
    img.onload = () => {
      overlay.style.width = img.clientWidth + "px";
      overlay.style.height = img.clientHeight + "px";
      const sx = img.clientWidth / w, sy = img.clientHeight / h;
      overlay.innerHTML = (state.regions || []).map((r) => {
        const left = r.x0 * sx, top = r.y0 * sy;
        const bw = Math.max(2, (r.x1 - r.x0) * sx), bh = Math.max(2, (r.y1 - r.y0) * sy);
        const cls = r.known ? "box" : "box low";
        return `<div class="${cls}" style="left:${left}px;top:${top}px;width:${bw}px;height:${bh}px">
                  <span class="tag">${r.label} · ${Number(r.confidence).toFixed(2)}</span>
                </div>`;
      }).join("");
    };
  }
  if (state.description) $("#say").textContent = state.description;

  const r = state.reading || {};
  const m = [];
  if (r.brightness !== undefined) m.push(`<span class="metric">light <b>${(r.brightness * 100).toFixed(0)}%</b></span>`);
  if (r.contrast !== undefined) m.push(`<span class="metric">detail <b>${(r.contrast * 100).toFixed(0)}%</b></span>`);
  if (r.peak_motion !== undefined) m.push(`<span class="metric">motion <b>${(r.peak_motion * 100).toFixed(0)}%</b></span>`);
  if (r.novelty !== undefined) m.push(`<span class="metric">novelty <b>${(r.novelty * 100).toFixed(0)}%</b></span>`);
  if (r.regions !== undefined) m.push(`<span class="metric">regions <b>${r.regions}</b></span>`);
  if (r.overlay_suspected) m.push(`<span class="metric flag">overlay</span>`);
  if (r.scene_changed) m.push(`<span class="metric flag">scene changed</span>`);
  $("#metrics").innerHTML = m.join("");

  $("#bRead").textContent = (state.frame_ms ?? 0).toFixed(1) + " ms/frame";
}

function connect() {
  const es = new EventSource("/api/stream");
  es.onmessage = (ev) => {
    try { renderSight(JSON.parse(ev.data)); } catch (e) {}
    const now = performance.now(), dt = now - lastT; lastT = now;
    if (dt > 0) { fps = 0.8 * fps + 0.2 * (1000 / dt); $("#bFps").textContent = fps.toFixed(1) + " fps"; }
  };
  es.onerror = () => { es.close(); setTimeout(connect, 1500); };
}

/* ---------------------------------------------------------------- */
/* Conversation                                                      */
/* ---------------------------------------------------------------- */
function addMsg(role, text, meta) {
  const d = document.createElement("div");
  d.className = "msg " + role;
  d.textContent = text;
  if (meta) {
    const m = document.createElement("div");
    m.className = "meta";
    m.innerHTML = meta;
    d.appendChild(m);
  }
  $("#chat").appendChild(d);
  $("#chat").scrollTop = $("#chat").scrollHeight;
  return d;
}

function describeTurn(r) {
  const src = r.brain_source || r.source || "?";
  const bits = [
    `brain <code>${src}</code>`,
    `turn <code>${(r.total_ms ?? 0).toFixed(0)} ms</code>`,
  ];
  if (r.action) {
    if (r.mutating === false) {
      // A perception step, not an actuation: the brain asked to look. Show it
      // as a glance, never as a gated click.
      bits.push(`<span class="badge warn">LOOK</span> <code>${r.action}</code>`);
    } else {
      const gate = r.gate_allowed === true ? "ALLOW" : (r.gate_allowed === false ? "DENY" : "—");
      const cls = r.gate_allowed === true ? "ok" : (r.gate_allowed === false ? "deny" : "warn");
      bits.push(`<span class="badge ${cls}">${gate}</span> action <code>${r.action}</code>` +
                (r.target ? ` target <code>${r.target}</code>` : ""));
      if (r.gate_reason) bits.push("gate: " + r.gate_reason);
      // A visible hesitation: the hand paused to look before it committed. This
      // is a real number from the turn record, not a decoration.
      if (r.hesitated_s > 0) bits.push(`hesitated <code>${(r.hesitated_s * 1000).toFixed(0)} ms</code>`);
      // A miss that was re-grounded and retried: show it so a correction is not
      // mistaken for a first-try success.
      if (r.corrections > 0) {
        bits.push(`<span class="badge ${r.corrected ? "ok" : "warn"}">` +
                  `${r.corrected ? "CORRECTED" : "RETRIED"}</span> ×${r.corrections}`);
      }
    }
  }
  return bits.join(" · ");
}

async function sendTurn(text) {
  const pending = addMsg("ai", "…");
  let streamed = "";
  let streamedEl = null;
  let stepEl = null;

  const showStream = () => {
    if (!streamedEl) {
      pending.remove();
      streamedEl = document.createElement("div");
      streamedEl.className = "msg ai streaming";
      $("#chat").appendChild(streamedEl);
    }
    streamedEl.textContent = streamed;
    $("#chat").scrollTop = $("#chat").scrollHeight;
  };

  try {
    const res = await fetch("/api/turn.stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text }),
    });
    if (!res.ok || !res.body) throw new Error("HTTP " + res.status);

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf("\n\n")) >= 0) {
        const frame = buf.slice(0, idx).trim();
        buf = buf.slice(idx + 2);
        if (!frame.startsWith("data: ")) continue;
        let evt;
        try { evt = JSON.parse(frame.slice(6)); } catch (e) { continue; }
        if (evt.type === "speech") {
          streamed += (streamed ? " " : "") + evt.text;
          showStream();
        } else if (evt.type === "step") {
          // A completed step of a multi-step task. Show the work as it happens,
          // so the assistant narrates and acts instead of freezing on one reply.
          // The step carries the same reply the speech stream already showed, so
          // the streaming bubble must go first or the sentence appears twice.
          const r = evt.record;
          if (stepEl) stepEl.remove();
          if (streamedEl) { streamedEl.remove(); streamedEl = null; }
          pending.remove();
          stepEl = addMsg("ai", r.said || "(step)", describeTurn(r));
        } else if (evt.type === "turn") {
          pending.remove();
          if (streamedEl) streamedEl.remove();
          if (stepEl) stepEl.remove();
          addMsg("ai", evt.record.said || "(no reply)", describeTurn(evt.record));
        } else if (evt.type === "error") {
          pending.remove();
          if (streamedEl) streamedEl.remove();
          if (stepEl) stepEl.remove();
          addMsg("sys", "error: " + evt.error);
        }
      }
    }
    pending.remove();
  } catch (e) {
    pending.remove();
    if (streamedEl) streamedEl.remove();
    if (stepEl) stepEl.remove();
    addMsg("sys", "error: " + e);
  }
}

$("#ask").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const q = $("#q").value.trim();
  if (!q) return;
  $("#q").value = "";
  ensureAudioCtx();
  addMsg("me", q);
  $("#send").disabled = true;
  try { await sendTurn(q); } finally { $("#send").disabled = false; $("#q").focus(); }
});

/* ---------------------------------------------------------------- */
/* The mouth: play the newest spoken clip in the page.               */
/* ---------------------------------------------------------------- */
let speechSeq = 0, audioCtx = null;
const speechQueue = [];
let playingSpeech = false;
/* True while the mouth is actually producing sound. Hands-free listening checks
   this so the assistant does not transcribe its own voice as the user's words. */
let mouthPlaying = false;

function ensureAudioCtx() {
  if (!audioCtx) {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (Ctx) audioCtx = new Ctx();
  }
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}

async function playNextSpeech() {
  if (playingSpeech || speechQueue.length === 0) return;
  const ctx = ensureAudioCtx();
  if (!ctx) { speechQueue.length = 0; return; }
  playingSpeech = true;
  mouthPlaying = true;
  const buf = speechQueue.shift();
  try {
    const audioBuf = await ctx.decodeAudioData(buf);
    await new Promise((resolve) => {
      const src = ctx.createBufferSource();
      src.buffer = audioBuf;
      src.connect(ctx.destination);
      src.onended = resolve;
      src.start();
    });
  } catch (e) { /* an undecodable clip must not stall the queue */ }
  playingSpeech = false;
  mouthPlaying = false;
  playNextSpeech();
}

async function pollSpeech() {
  try {
    const res = await fetch("/api/speech.wav?after=" + speechSeq, { cache: "no-store" });
    if (res.status === 200) {
      const seq = parseInt(res.headers.get("X-Speech-Seq") || "0", 10);
      const buf = await res.arrayBuffer();
      if (seq > speechSeq) speechSeq = seq;
      speechQueue.push(buf);
      playNextSpeech();
    }
  } catch (e) { /* transient */ }
  setTimeout(pollSpeech, 400);
}

/* ---------------------------------------------------------------- */
/* The ears: record the mic in the page, post it for transcription.  */
/* ---------------------------------------------------------------- */
let mediaRecorder = null, recordedChunks = [], recording = false;

async function startRecording() {
  if (recording || !earsEnabled) return;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    recordedChunks = [];
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = (e) => { if (e.data.size) recordedChunks.push(e.data); };
    mediaRecorder.onstop = async () => {
      stream.getTracks().forEach((t) => t.stop());
      await sendRecording(new Blob(recordedChunks, { type: "audio/webm" }));
    };
    mediaRecorder.start();
    recording = true;
    $("#mic").classList.add("rec");
    $("#mic").title = "recording… click to stop";
  } catch (e) {
    addMsg("sys", "microphone unavailable: " + e);
  }
}

function stopRecording() {
  if (!recording) return;
  recording = false;
  $("#mic").classList.remove("rec");
  $("#mic").title = "hold to talk";
  try { mediaRecorder.stop(); } catch (e) {}
}

function b64FromBytes(bytes) {
  let bin = "";
  const chunk = 0x8000;
  for (let i = 0; i < bytes.length; i += chunk) {
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
  }
  return btoa(bin);
}

async function sendRecording(blob, opts) {
  const quiet = !!(opts && opts.quiet);
  const pending = quiet ? null : addMsg("ai", "… sun raha hoon");
  try {
    const buf = await blob.arrayBuffer();
    const ctx = ensureAudioCtx();
    let payload = null;
    try {
      const decoded = await ctx.decodeAudioData(buf.slice(0));
      const targetRate = 16000;
      const off = new OfflineAudioContext(1, Math.ceil(decoded.duration * targetRate), targetRate);
      const src = off.createBufferSource();
      src.buffer = decoded;
      src.connect(off.destination);
      src.start();
      const rendered = await off.startRendering();
      const pcm = rendered.getChannelData(0);
      const pcm16 = new Int16Array(pcm.length);
      for (let i = 0; i < pcm.length; i++) {
        pcm16[i] = Math.max(-1, Math.min(1, pcm[i])) * 32767;
      }
      payload = { audio_base64: b64FromBytes(new Uint8Array(pcm16.buffer)), sample_rate: targetRate, is_wav: false };
    } catch (e) {
      payload = { audio_base64: b64FromBytes(new Uint8Array(buf)), sample_rate: 16000, is_wav: false };
    }
    const res = await fetch("/api/hear", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    const r = await res.json();
    if (pending) pending.remove();
    if (r.text) {
      addMsg("me", r.text);
      await sendTurn(r.text);
    } else if (!quiet) {
      addMsg("sys", "kuch sunai nahi diya (" + (r.error || "no speech") + ")");
    }
    // In hands-free mode a silent window is dropped on purpose: it is not a
    // turn, and printing "no speech" every 4 seconds would drown the chat.
  } catch (e) {
    if (pending) pending.remove();
    if (!quiet) addMsg("sys", "hearing failed: " + e);
  }
}

const mic = $("#mic");
mic.addEventListener("mousedown", startRecording);
mic.addEventListener("mouseup", stopRecording);
mic.addEventListener("mouseleave", () => { if (recording) stopRecording(); });
mic.addEventListener("touchstart", (e) => { e.preventDefault(); startRecording(); });
mic.addEventListener("touchend", (e) => { e.preventDefault(); stopRecording(); });

/* ---------------------------------------------------------------- */
/* Hands-free listening: no button. Talk and it answers.             */
/* ---------------------------------------------------------------- */
/* A person does not press a button to be heard. This records short
   windows on a loop and submits any window that contains speech, so the
   assistant just listens. Two things it deliberately does NOT do:
     - it stops while the assistant is speaking, so the mouth is not fed
       back into the ears as the user's words (the barge-in problem);
     - a window with no speech is dropped silently, so silence is not a
       turn and the conversation does not fill up with "(no speech)".
   It is OFF until the page is clicked once, because browsers refuse mic
   access before a user gesture. That click is a permission grant, not a
   "start listening" button. */
let handsFree = false, listening = false, speakingNow = false;

async function handsFreeTick() {
  if (!handsFree) return;
  // Stay quiet while the assistant itself is speaking (mouthPlaying) so its own
  // voice is not transcribed back as the user's words, and while a turn is being
  // handled.
  if (listening || speakingNow || recording || mouthPlaying) {
    setTimeout(handsFreeTick, 300); return;
  }
  listening = true;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const chunks = [];
    const rec = new MediaRecorder(stream);
    rec.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
    const done = new Promise((resolve) => { rec.onstop = resolve; });
    rec.start();
    await new Promise((r) => setTimeout(r, 3500));
    rec.stop();
    await done;
    stream.getTracks().forEach((t) => t.stop());
    const blob = new Blob(chunks, { type: "audio/webm" });
    if (blob.size > 2000) {
      // Only a window with real audio is worth a round-trip; the server still
      // decides whether it contained speech.
      speakingNow = true;
      await sendRecording(blob, { quiet: true });
      speakingNow = false;
    }
  } catch (e) {
    handsFree = false;
    const b = $("#bWatch");
    if (b) { b.textContent = "watch: mic blocked"; b.className = "badge deny"; }
  }
  listening = false;
  setTimeout(handsFreeTick, 400);
}

function startHandsFree() {
  if (handsFree || !earsEnabled) return;
  handsFree = true;
  const b = $("#bListen");
  if (b) { b.textContent = "listening"; b.className = "badge ok"; }
  handsFreeTick();
}

/* ---------------------------------------------------------------- */
/* Scene switcher: only for the scripted demo screen.                */
/* ---------------------------------------------------------------- */
const SCENES = ["desktop", "terminal", "media", "dialog", "scroll"];
async function loadScenes() {
  const wrap = $("#scenes");
  wrap.innerHTML = "";
  const cap = await (await fetch("/api/capabilities")).json().catch(() => ({}));
  if (cap.eyes !== "ScenePerception") return;   // a real screen cannot be switched
  SCENES.forEach((name) => {
    const b = document.createElement("button");
    b.textContent = name;
    b.addEventListener("click", async () => {
      const res = await fetch("/api/scene", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ category: name }),
      });
      const r = await res.json();
      if (r.error) addMsg("sys", "scene not changed: " + r.error);
      else [...wrap.children].forEach((c) => c.classList.toggle("on", c.textContent === name));
    });
    if (name === "desktop") b.classList.add("on");
    wrap.appendChild(b);
  });
}

/* ---------------------------------------------------------------- */
/* Proactive remarks: what the assistant said on its own.            */
/* ---------------------------------------------------------------- */
let seenRemarks = 0;
async function pollAwareness() {
  try {
    const res = await fetch("/api/awareness", { cache: "no-store" });
    if (res.ok) {
      const a = await res.json();
      const recent = a.recent || [];
      // `recent` is a bounded tail, so a count that only grows would mis-fire
      // after the list is trimmed. Compare the newest timestamp instead.
      const newest = recent.length ? recent[recent.length - 1].at : 0;
      if (newest > seenRemarks) {
        // Only the remarks newer than the last one we drew, oldest first, so a
        // burst arrives in the order it was spoken.
        recent.filter((r) => r.at > seenRemarks).forEach((r) => {
          addMsg("ai", r.text,
            `<span class="badge warn">NOTICED</span> ${r.reason} · brain <code>${r.source}</code>`);
        });
        seenRemarks = newest;
      }
    }
  } catch (e) { /* transient */ }
  setTimeout(pollAwareness, 1500);
}

loadCaps();
loadScenes();
connect();
pollSpeech();
pollAwareness();
addMsg("sys", "AVCS assistant ready — boliye ya type kijiye.");
$("#q").focus();

/* Hands-free listening begins on the first real interaction anywhere on the
   page. Browsers refuse microphone access before a user gesture, so one click
   is unavoidable; after it, no button is needed to be heard. */
document.addEventListener("click", function once() {
  document.removeEventListener("click", once);
  if (!recording && earsEnabled) startHandsFree();
}, { once: true });
</script>
