<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:#0b1020;}
  svg{display:block;}
  text{font-family:'DejaVu Sans',sans-serif;}
  .title{font-size:38px;font-weight:700;fill:#e6ecff;}
  .subtitle{font-size:16px;fill:#8b97b8;}
  .h{font-size:19px;font-weight:700;fill:#e6ecff;}
  .hs{font-size:13px;fill:#8b97b8;}
  .ct{font-size:15.5px;font-weight:700;}
  .cs{font-size:11.5px;fill:#7f8cad;}
  .cd{font-size:12.5px;fill:#a9b4d0;}
  .mono{font-family:'DejaVu Sans Mono',monospace;font-size:12px;fill:#c9d3ee;}
  .monos{font-family:'DejaVu Sans Mono',monospace;font-size:11px;fill:#93a0c2;}
  .lab{font-size:11.5px;font-weight:700;fill:#dbe3fb;}
  .tiny{font-size:10.5px;fill:#7f8cad;}
  .panel{fill:#131a30;stroke:#24304f;stroke-width:1.5;rx:16;}
  .card{fill:#0f1729;stroke:#24304f;rx:12;}
  .box{fill:#0c1424;stroke:#2c3a5e;rx:10;}
  .boxa{fill:#141d33;stroke:#3a4a72;rx:10;}
</style></head>
<body>
<svg width="1720" height="1620" viewBox="0 0 1720 1620" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/></marker>
  <marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker>
  <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#7f8cad"/></marker>
  <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/></marker>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/></filter>
</defs>

<rect x="0" y="0" width="1720" height="1620" fill="#0b1020"/>

<!-- ============ TITLE ============ -->
<text x="60" y="54" class="title">AVC — Artificial Visual Cortex</text>
<text x="60" y="84" class="subtitle">Local body (real-time, private)   +   Cloud brain (text-only LLM)   =   one human-like computer operator</text>
<line x1="40" y1="106" x2="1680" y2="106" stroke="#24304f" stroke-width="1.5"/>

<!-- ============ PANEL 1 : BODY ============ -->
<rect x="40" y="124" width="800" height="470" class="panel" filter="url(#sh)"/>
<text x="64" y="158" class="h">1 · THE BODY</text>
<text x="64" y="180" class="hs">Local · real-time · private — nothing leaves the machine</text>

<!-- card: Eyes -->
<rect x="64" y="198" width="366" height="179" class="card"/>
<ellipse cx="90" cy="224" rx="21" ry="12" fill="none" stroke="#22d3ee" stroke-width="2"/>
<circle cx="90" cy="224" r="5.5" fill="#22d3ee"/>
<text x="142" y="218" class="ct" fill="#22d3ee">AANKHEIN — Eyes</text>
<text x="142" y="238" class="cs">2 ms/tick · ~490 FPS on 4 CPU cores</text>
<text x="80" y="274" class="cd">Screen ko lagataar dekhti hain — 3-second</text>
<text x="80" y="294" class="cd">screenshot nahi. Motion, popup, clickable</text>
<text x="80" y="314" class="cd">elements turant pakadti hain.</text>
<text x="80" y="344" class="tiny">STATUS:  working · trained</text>

<!-- card: Ears -->
<rect x="450" y="198" width="366" height="179" class="card"/>
<path d="M470,210 c-15,0 -20,11 -15,20 c3,6 9,8 9,15 c0,6 -5,8 -9,8"
      fill="none" stroke="#22d3ee" stroke-width="2.2" stroke-linecap="round"/>
<text x="528" y="218" class="ct" fill="#22d3ee">KAAN — Ears</text>
<text x="528" y="238" class="cs">local speech-to-text</text>
<text x="466" y="274" class="cd">Aapki aawaz sunte hain aur text banate</text>
<text x="466" y="294" class="cd">hain — "X task karo" samajhne ke liye.</text>
<text x="466" y="314" class="cd">Bilkul local, cloud par audio nahi.</text>
<text x="466" y="344" class="tiny">STATUS:  to be built</text>

<!-- card: Voice -->
<rect x="64" y="393" width="366" height="179" class="card"/>
<path d="M68,405 h10 l12,-10 v38 l-12,-10 h-10 z" fill="#22d3ee" opacity="0.92"/>
<path d="M97,404 a13,13 0 0 1 0,18" fill="none" stroke="#22d3ee" stroke-width="2"/>
<path d="M104,399 a20,20 0 0 1 0,28" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.6"/>
<text x="142" y="413" class="ct" fill="#22d3ee">MUH — Voice</text>
<text x="142" y="433" class="cs">local text-to-speech</text>
<text x="80" y="469" class="cd">Aapko bol kar jawab deta hai, insaan ki</text>
<text x="80" y="489" class="cd">tarah. "Ho gaya, X khul gayi hai."</text>
<text x="80" y="509" class="cd">Bilkul local, cloud par audio nahi.</text>
<text x="80" y="539" class="tiny">STATUS:  to be built</text>

<!-- card: Hands -->
<rect x="450" y="393" width="366" height="179" class="card"/>
<path d="M468,402 l0,30 l8,-8 l7,16 l7,-3 l-7,-15 l11,0 z" fill="#22d3ee"/>
<text x="528" y="413" class="ct" fill="#22d3ee">HAATH — Hands</text>
<text x="528" y="433" class="cs">~350 ms per smooth click</text>
<text x="466" y="469" class="cd">Mouse ko insaan jaisi minimum-jerk glide</text>
<text x="466" y="489" class="cd">se chalata hai, click aur type karta hai.</text>
<text x="466" y="509" class="cd">Jerky jump nahi.</text>
<text x="466" y="539" class="tiny">STATUS:  working · capability-gated</text>

<!-- ============ PANEL 2 : NEURAL NETWORK ============ -->
<rect x="880" y="124" width="800" height="470" class="panel" filter="url(#sh)"/>
<text x="904" y="158" class="h">2 · INSIDE THE EYES — the vision neural network</text>
<text x="904" y="180" class="hs">Local CNN · CPU only · no cloud, no OCR, pure pixels</text>

<!-- A: input frame -->
<text x="947" y="240" class="lab" text-anchor="middle">Screen</text>
<text x="947" y="254" class="lab" text-anchor="middle">frame</text>
<rect x="904" y="266" width="86" height="104" class="boxa"/>
<g stroke="#22d3ee" stroke-width="0.7" opacity="0.55">
  <line x1="904" y1="292" x2="990" y2="292"/><line x1="904" y1="318" x2="990" y2="318"/>
  <line x1="904" y1="344" x2="990" y2="344"/><line x1="926" y1="266" x2="926" y2="370"/>
  <line x1="948" y1="266" x2="948" y2="370"/><line x1="970" y1="266" x2="970" y2="370"/>
</g>
<rect x="904" y="266" width="86" height="104" fill="none" stroke="#22d3ee" stroke-width="1.6" rx="4"/>
<text x="947" y="392" class="monos" text-anchor="middle">128x128x3</text>

<!-- B: mailbox -->
<rect x="1008" y="286" width="76" height="64" class="box"/>
<text x="1046" y="312" class="monos" text-anchor="middle">1-slot</text>
<text x="1046" y="330" class="monos" text-anchor="middle">mailbox</text>
<text x="1046" y="372" class="tiny" text-anchor="middle">drops stale</text>
<text x="1046" y="386" class="tiny" text-anchor="middle">frames</text>

<!-- C: encoder -->
<text x="1177" y="228" class="lab" text-anchor="middle">Multi-Scale CNN Encoder</text>
<rect x="1112" y="238" width="130" height="38" class="box"/>
<text x="1177" y="262" class="monos" text-anchor="middle">scale_half</text>
<rect x="1112" y="284" width="130" height="38" class="box"/>
<text x="1177" y="308" class="monos" text-anchor="middle">scale_quarter</text>
<rect x="1112" y="330" width="130" height="38" class="box"/>
<text x="1177" y="354" class="monos" text-anchor="middle">scale_eighth</text>
<rect x="1112" y="380" width="130" height="44" fill="#16223c" stroke="#22d3ee" stroke-width="1.6" rx="8"/>
<text x="1177" y="400" class="monos" text-anchor="middle" fill="#22d3ee">16 x 16 x 48</text>
<text x="1177" y="414" class="tiny" text-anchor="middle" fill="#22d3ee">feature grid</text>

<!-- D: ConvGRU -->
<text x="1337" y="256" class="lab" text-anchor="middle">ConvGRUCell</text>
<rect x="1272" y="268" width="130" height="140" class="boxa"/>
<circle cx="1302" cy="300" r="13" fill="none" stroke="#22d3ee" stroke-width="1.6"/>
<text x="1302" y="304" class="monos" text-anchor="middle">z</text>
<circle cx="1337" cy="300" r="13" fill="none" stroke="#22d3ee" stroke-width="1.6"/>
<text x="1337" y="304" class="monos" text-anchor="middle">r</text>
<circle cx="1372" cy="300" r="13" fill="none" stroke="#22d3ee" stroke-width="1.6"/>
<text x="1372" y="304" class="monos" text-anchor="middle">h</text>
<text x="1337" y="342" class="tiny" text-anchor="middle">temporal memory</text>
<text x="1337" y="360" class="tiny" text-anchor="middle">across frames</text>
<text x="1337" y="386" class="tiny" text-anchor="middle" fill="#22d3ee">persistent state</text>

<!-- E: heads -->
<text x="1540" y="228" class="lab" text-anchor="middle">Output Heads</text>
<rect x="1422" y="238" width="236" height="62" class="box"/>
<text x="1438" y="262" class="monos">Change / Motion</text>
<text x="1438" y="282" class="tiny">surprise + displacement grid</text>
<rect x="1422" y="308" width="236" height="62" class="box"/>
<text x="1438" y="332" class="monos">Latent Predictor</text>
<text x="1438" y="352" class="tiny">VICReg 64-dim future state</text>
<rect x="1422" y="378" width="236" height="62" class="box"/>
<text x="1438" y="402" class="monos">Word Recognizer</text>
<text x="1438" y="422" class="tiny">131 fixed UI button words</text>

<!-- arrows -->
<line x1="992" y1="318" x2="1004" y2="318" stroke="#22d3ee" stroke-width="2" marker-end="url(#ac)"/>
<line x1="1086" y1="318" x2="1108" y2="318" stroke="#22d3ee" stroke-width="2" marker-end="url(#ac)"/>
<line x1="1244" y1="318" x2="1268" y2="318" stroke="#22d3ee" stroke-width="2" marker-end="url(#ac)"/>
<line x1="1404" y1="318" x2="1418" y2="318" stroke="#22d3ee" stroke-width="2" marker-end="url(#ac)"/>

<!-- output strip -->
<rect x="904" y="492" width="754" height="76" fill="#101a2e" stroke="#22d3ee" stroke-width="1.6" rx="10"/>
<text x="1281" y="518" class="ct" fill="#22d3ee" text-anchor="middle">→ OBSERVATION  (text only)</text>
<text x="1281" y="540" class="monos" text-anchor="middle">{ screen, stability, elements, surprise, confidence }</text>
<text x="1281" y="558" class="tiny" text-anchor="middle">zero pixels · zero coordinates leave the eye</text>
<line x1="1540" y1="442" x2="1540" y2="488" stroke="#22d3ee" stroke-width="2" marker-end="url(#ac)"/>

<!-- ============ PANEL 3 : LOOP ============ -->
<rect x="40" y="614" width="1640" height="540" class="panel" filter="url(#sh)"/>
<text x="64" y="648" class="h">3 · THE LOOP — how the body and the brain talk</text>
<text x="64" y="670" class="hs">Turn-based: AVC reports what it sees → brain decides → AVC acts → AVC reports back → brain replans</text>

<!-- lifelines -->
<rect x="230" y="692" width="230" height="46" fill="#0f2b33" stroke="#22d3ee" stroke-width="1.6" rx="10"/>
<text x="345" y="713" class="ct" fill="#22d3ee" text-anchor="middle">AVC  —  BODY</text>
<text x="345" y="730" class="tiny" text-anchor="middle" fill="#7fd8e8">local · 2 ms eyes · real-time</text>
<line x1="345" y1="738" x2="345" y2="1128" stroke="#22d3ee" stroke-width="1.2" stroke-dasharray="5 6" opacity="0.5"/>

<rect x="1130" y="692" width="230" height="46" fill="#241a3d" stroke="#a78bfa" stroke-width="1.6" rx="10"/>
<text x="1245" y="713" class="ct" fill="#a78bfa" text-anchor="middle">CLOUD BRAIN</text>
<text x="1245" y="730" class="tiny" text-anchor="middle" fill="#c4b0f5">LLM · text only · 1-2 s per turn</text>
<line x1="1245" y1="738" x2="1245" y2="1128" stroke="#a78bfa" stroke-width="1.2" stroke-dasharray="5 6" opacity="0.5"/>

<!-- msg 1: user -->
<text x="70" y="782" class="lab" fill="#dbe3fb">Aap</text>
<line x1="70" y1="790" x2="341" y2="790" stroke="#7f8cad" stroke-width="2" marker-end="url(#ag)"/>
<text x="150" y="784" class="cd" fill="#c9d3ee">"X application open karo"</text>

<!-- msg 2: AVC -> Brain -->
<line x1="349" y1="840" x2="1241" y2="840" stroke="#22d3ee" stroke-width="2.2" marker-end="url(#ac)"/>
<text x="560" y="832" class="cd" fill="#7fd8e8">1 · "Screen par GUI application dikh raha hai. 1 clickable center, 1 typeable footer."</text>

<!-- msg 3: Brain -> AVC -->
<line x1="1241" y1="890" x2="349" y2="890" stroke="#a78bfa" stroke-width="2.2" marker-end="url(#av)"/>
<text x="560" y="882" class="cd" fill="#c4b0f5">2 · "X ko click karo, aur mujhe batao kya hua"</text>

<!-- msg 4: AVC self action -->
<path d="M349,918 C 250,918 250,958 349,958" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#ac)"/>
<text x="360" y="944" class="cd" fill="#7fd8e8">3 · haath click karta hai + aankh verify karti hai</text>

<!-- msg 5: AVC -> Brain -->
<line x1="349" y1="990" x2="1241" y2="990" stroke="#22d3ee" stroke-width="2.2" marker-end="url(#ac)"/>
<text x="560" y="982" class="cd" fill="#7fd8e8">4 · "Click ho gaya. Naya window khul gaya, screen badal gayi."</text>

<!-- msg 6: Brain -> AVC -->
<line x1="1241" y1="1040" x2="349" y2="1040" stroke="#a78bfa" stroke-width="2.2" marker-end="url(#av)"/>
<text x="560" y="1032" class="cd" fill="#c4b0f5">5 · replan: "ab us window mein Y button dhoondho aur dabao"</text>

<!-- msg 7: AVC -> user -->
<line x1="345" y1="1090" x2="70" y2="1090" stroke="#7f8cad" stroke-width="2" marker-end="url(#ag)"/>
<text x="110" y="1082" class="cd" fill="#c9d3ee">6 · "Ho gaya — X application khul gayi hai"</text>

<!-- loop note -->
<path d="M1300,1040 C1390,1040 1390,840 1300,840" fill="none" stroke="#fbbf24" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#aa)"/>
<text x="1420" y="944" class="lab" fill="#fbbf24">loop back</text>
<text x="1420" y="962" class="tiny">jab tak kaam poora na ho</text>

<!-- ============ PANEL 4 : BRAIN ============ -->
<rect x="40" y="1174" width="1640" height="380" class="panel" filter="url(#sh)"/>
<text x="64" y="1208" class="h">4 · THE BRAIN — cloud LLM</text>
<text x="64" y="1230" class="hs">Reasons, plans, replans. Never sees a pixel. Not a vision model — a text LLM.</text>

<!-- col 1 -->
<rect x="64" y="1250" width="500" height="240" class="card"/>
<text x="84" y="1278" class="lab" fill="#a78bfa">RECEIVES  —  text</text>
<text x="84" y="1306" class="mono">{</text>
<text x="84" y="1326" class="mono">  "task": "X application open karo",</text>
<text x="84" y="1346" class="mono">  "observation": {</text>
<text x="84" y="1366" class="mono">    "screen": "browser_webpage",</text>
<text x="84" y="1386" class="mono">    "stability": "stable",</text>
<text x="84" y="1406" class="mono">    "elements": ["clickable @ center",</text>
<text x="84" y="1426" class="mono">                 "typeable @ footer"],</text>
<text x="84" y="1446" class="mono">    "text": null</text>
<text x="84" y="1466" class="mono">  }</text>
<text x="84" y="1486" class="mono">}</text>

<!-- col 2 -->
<rect x="600" y="1250" width="500" height="240" class="card"/>
<text x="620" y="1278" class="lab" fill="#a78bfa">DOES</text>
<text x="620" y="1310" class="cd">•  Aapka task samajhta hai</text>
<text x="620" y="1340" class="cd">•  AVC ki observation padhta hai</text>
<text x="620" y="1370" class="cd">•  Agla step decide karta hai</text>
<text x="620" y="1400" class="cd">•  Feedback par replan karta hai</text>
<text x="620" y="1430" class="cd">•  Atak jaye to user se poochta hai</text>
<text x="620" y="1460" class="cd">•  Kaam poora ho to batata hai</text>
<text x="620" y="1490" class="tiny">Yeh dimaag hai — aankh nahi, haath nahi.</text>

<!-- col 3 -->
<rect x="1136" y="1250" width="520" height="240" class="card"/>
<text x="1156" y="1278" class="lab" fill="#a78bfa">SENDS  —  intent</text>
<text x="1156" y="1306" class="mono">{</text>
<text x="1156" y="1326" class="mono">  "thought": "X ko click karo",</text>
<text x="1156" y="1346" class="mono">  "op": "click",</text>
<text x="1156" y="1366" class="mono">  "target": "X application",</text>
<text x="1156" y="1386" class="mono">  "expected": "window khul jaye"</text>
<text x="1156" y="1406" class="mono">}</text>
<text x="1156" y="1440" class="tiny">Koi coordinate nahi. Sirf naam aur irada.</text>
<text x="1156" y="1462" class="tiny">Pixel dhoondhna AVC ka kaam hai.</text>

<!-- boundary rule -->
<rect x="64" y="1508" width="1592" height="34" fill="#1a1226" stroke="#a78bfa" stroke-width="1.4" rx="9"/>
<text x="860" y="1530" class="lab" fill="#c4b0f5" text-anchor="middle">BOUNDARY RULE:  sirf text is line ko cross karta hai  —  zero images, zero coordinates</text>

<!-- footer -->
<text x="60" y="1580" class="tiny">AVC v1 · measured on a 4-core CPU, no GPU · eye numbers from real runs · Ears / Voice not yet built · Hands safety-gated by design</text>
</svg>
</body></html>
