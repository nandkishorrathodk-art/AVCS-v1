<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:#0b1020;}
  svg{display:block;}
  text{font-family:'DejaVu Sans',sans-serif;}
  .title{font-size:36px;font-weight:700;fill:#e6ecff;}
  .subtitle{font-size:15px;fill:#8b97b8;}
  .h{font-size:21px;font-weight:700;}
  .hs{font-size:13.5px;fill:#8b97b8;}
  .chip{font-size:14px;font-weight:700;}
  .chip2{font-size:11.5px;fill:#9aa6c6;}
  .chip3{font-size:11px;fill:#7f8cad;}
  .glue{font-size:16px;font-weight:700;fill:#ffb4b4;}
  .glue2{font-size:12.5px;fill:#f0a5a5;}
  .cap{font-size:14px;font-weight:700;}
  .tiny{font-size:11px;fill:#7f8cad;}
  .mono{font-family:'DejaVu Sans Mono',monospace;font-size:12px;fill:#c9d3ee;}
  .panel{fill:#131a30;stroke:#24304f;stroke-width:1.5;rx:18;}
  .panelbad{fill:#1b1420;stroke:#5a2b3a;stroke-width:1.5;rx:18;}
  .panelgood{fill:#0f1c22;stroke:#1e5a5a;stroke-width:1.5;rx:18;}
  .box{fill:#0c1424;stroke:#2c3a5e;rx:10;}
  .boxbad{fill:#241722;stroke:#6b3040;rx:10;}
  .boxgood{fill:#0d2026;stroke:#2a7a7a;rx:10;}
  .trunk{fill:#0a1a20;stroke:#22d3ee;stroke-width:2;rx:16;}
</style></head>
<body>
<svg width="1720" height="1700" viewBox="0 0 1720 1700" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="ared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#e05a6a"/></marker>
  <marker id="acy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/></marker>
  <marker id="agr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#7f8cad"/></marker>
  <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/></filter>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="0" stdDeviation="9" flood-color="#22d3ee" flood-opacity="0.5"/></filter>
</defs>

<rect x="0" y="0" width="1720" height="1700" fill="#0b1020"/>

<!-- ============ TITLE ============ -->
<text x="60" y="54" class="title">AVC — ek model, ek insaan</text>
<text x="60" y="84" class="subtitle">Aap jo chahte ho: <tspan fill="#7fd8e8">ek hi deep-learning model</tspan> jo dekhta, samajhta, sochta, karta hai — ek insaan ka dusra roop.  Neeche: aaj kya hai, aur kya hona chahiye.</text>
<line x1="40" y1="106" x2="1680" y2="106" stroke="#24304f" stroke-width="1.5"/>

<!-- ============================================================= -->
<!-- ================== PANEL 1 : TODAY (BAD) ==================== -->
<!-- ============================================================= -->
<rect x="40" y="126" width="1640" height="700" class="panelbad" filter="url(#sh)"/>
<text x="64" y="166" class="h" fill="#ff9aa8">AAJ — tukdon ka jhund  (a bag of parts)</text>
<text x="64" y="190" class="hs">ek "model" nahi — <tspan fill="#ffb4b4">~7 alag networks</tspan> + <tspan fill="#ffb4b4">77 hand-written if/elif</tspan> jo unhe jodti hain. "Samajh" kisi ek jagah nahi rehti.</text>

<!-- screen -->
<rect x="70" y="296" width="94" height="100" class="boxbad"/>
<g stroke="#e05a6a" stroke-width="0.7" opacity="0.5">
  <line x1="70" y1="329" x2="164" y2="329"/><line x1="70" y1="362" x2="164" y2="362"/>
  <line x1="101" y1="296" x2="101" y2="396"/><line x1="132" y1="296" x2="132" y2="396"/>
</g>
<rect x="70" y="296" width="94" height="100" fill="none" stroke="#e05a6a" stroke-width="1.4" rx="4"/>
<text x="117" y="420" class="tiny" text-anchor="middle" fill="#e08a95">raw pixels</text>

<!-- 6 detector chips -->
<g>
  <rect x="196" y="242" width="196" height="88" class="boxbad"/>
  <text x="212" y="270" class="chip" fill="#ffd0d6">Eye CNN</text>
  <text x="212" y="292" class="chip2">system1_v1 · 1.7M</text>
  <text x="212" y="312" class="chip3">scene category</text>

  <rect x="416" y="242" width="196" height="88" class="boxbad"/>
  <text x="432" y="270" class="chip" fill="#ffd0d6">Word Recognizer</text>
  <text x="432" y="292" class="chip2">131 fixed words · 240k</text>
  <text x="432" y="312" class="chip3">closed vocabulary</text>

  <rect x="636" y="242" width="196" height="88" class="boxbad"/>
  <text x="652" y="270" class="chip" fill="#ffd0d6">Goal Grounder</text>
  <text x="652" y="292" class="chip2">200k</text>
  <text x="652" y="312" class="chip3">where is X</text>

  <rect x="196" y="346" width="196" height="88" class="boxbad"/>
  <text x="212" y="374" class="chip" fill="#ffd0d6">Stability Head</text>
  <text x="212" y="396" class="chip2">thresholds 0.55/0.22</text>
  <text x="212" y="416" class="chip3">is screen calm</text>

  <rect x="416" y="346" width="196" height="88" class="boxbad"/>
  <text x="432" y="374" class="chip" fill="#ffd0d6">Action Policy Head</text>
  <text x="432" y="396" class="chip2">click / type / scroll</text>
  <text x="432" y="416" class="chip3">what to do</text>

  <rect x="636" y="346" width="196" height="88" class="boxbad"/>
  <text x="652" y="374" class="chip" fill="#ffd0d6">Foveal Refiner</text>
  <text x="652" y="396" class="chip2">1.35M</text>
  <text x="652" y="416" class="chip3">zoom + refine</text>
</g>

<!-- tangled arrows between chips -->
<g stroke="#8a3a4a" stroke-width="1.3" opacity="0.75" fill="none">
  <path d="M392,286 C440,240 560,230 636,286" marker-end="url(#ared)"/>
  <path d="M636,300 C560,360 440,380 392,330" marker-end="url(#ared)"/>
  <path d="M294,330 C300,380 330,400 416,390" marker-end="url(#ared)"/>
  <path d="M514,330 C520,380 540,400 636,390" marker-end="url(#ared)"/>
  <path d="M294,390 C320,340 380,300 416,286" marker-end="url(#ared)"/>
  <path d="M164,346 C180,300 190,280 196,286" marker-end="url(#ared)"/>
</g>
<text x="514" y="470" class="tiny" text-anchor="middle" fill="#e08a95">in sab ko aapas mein jodne ke liye code likha gaya hai</text>

<!-- glue band -->
<rect x="196" y="484" width="636" height="76" fill="#3a1622" stroke="#e05a6a" stroke-width="1.6" rx="12"/>
<text x="514" y="514" class="glue" text-anchor="middle">77 hand-written if / elif branches</text>
<text x="514" y="538" class="glue2" text-anchor="middle">"samajh" yahan rehti hai — kisi neural network mein nahi, code mein</text>

<!-- rule engine -->
<rect x="900" y="242" width="320" height="180" class="boxbad"/>
<text x="920" y="274" class="chip" fill="#ffd0d6">MockReasoningProvider</text>
<text x="920" y="298" class="chip2">rule engine — NOT an LLM</text>
<text x="920" y="326" class="chip3">if stability == unstable: wait</text>
<text x="920" y="346" class="chip3">elif absent: stop</text>
<text x="920" y="366" class="chip3">elif present: click</text>
<text x="920" y="396" class="tiny" fill="#e08a95">"brain" bhi ek rule-list hai</text>

<!-- output -->
<rect x="1280" y="242" width="356" height="318" class="boxbad"/>
<text x="1300" y="274" class="chip" fill="#ffd0d6">Aaj ka nateeja</text>
<text x="1300" y="304" class="chip2">✗  screen par text padh nahi sakta</text>
<text x="1300" y="328" class="chip2">✗  category galat (modal_dialog)</text>
<text x="1300" y="352" class="chip2">✗  click step ruk jata tha</text>
<text x="1300" y="376" class="chip2">✗  naye app par 0.00% sahi</text>
<text x="1300" y="400" class="chip2">✗  "samajh" 77 if/elif mein bikhri</text>
<text x="1300" y="436" class="tiny" fill="#e08a95">ek insaan nahi —</text>
<text x="1300" y="456" class="tiny" fill="#e08a95">spare parts ka dabba</text>

<!-- arrows to rule engine / output -->
<line x1="832" y1="330" x2="896" y2="330" stroke="#e05a6a" stroke-width="2" marker-end="url(#ared)"/>
<line x1="1220" y1="330" x2="1276" y2="330" stroke="#e05a6a" stroke-width="2" marker-end="url(#ared)"/>

<!-- ============================================================= -->
<!-- ============ PANEL 2 : TARGET (GOOD) ======================== -->
<!-- ============================================================= -->
<rect x="40" y="852" width="1640" height="700" class="panelgood" filter="url(#sh)"/>
<text x="64" y="892" class="h" fill="#7fe8e8">HONA CHAHIYE — ek model, ek insaan ka dusra roop</text>
<text x="64" y="916" class="hs">Ek hi deep-learning network. Pixels andar, ek latent "mann" banata hai, aur usi se samajhta, sochta, karta aur bolta hai. Sab ek saath train hota hai.</text>

<!-- screen -->
<rect x="86" y="1006" width="96" height="104" class="boxgood"/>
<g stroke="#22d3ee" stroke-width="0.7" opacity="0.55">
  <line x1="86" y1="1040" x2="182" y2="1040"/><line x1="86" y1="1074" x2="182" y2="1074"/>
  <line x1="118" y1="1006" x2="118" y2="1110"/><line x1="150" y1="1006" x2="150" y2="1110"/>
</g>
<rect x="86" y="1006" width="96" height="104" fill="none" stroke="#22d3ee" stroke-width="1.6" rx="4"/>
<text x="134" y="1134" class="tiny" text-anchor="middle" fill="#7fd8e8">raw pixels (60 FPS)</text>

<!-- ONE trunk -->
<rect x="238" y="966" width="680" height="330" class="trunk" filter="url(#glow)"/>
<text x="578" y="1002" class="chip" fill="#7fe8e8" text-anchor="middle" font-size="18">EK MODEL — ek shared dimaag</text>
<text x="578" y="1026" class="chip2" text-anchor="middle">ek trunk · ek latent "mann" · ek loss · end-to-end</text>

<!-- internal layer stack -->
<g>
  <rect x="266" y="1052" width="150" height="52" class="boxgood"/>
  <text x="341" y="1075" class="mono" text-anchor="middle" fill="#8fe8e8">shared trunk</text>
  <text x="341" y="1093" class="chip3" text-anchor="middle">CNN + temporal</text>

  <rect x="436" y="1052" width="150" height="52" class="boxgood"/>
  <text x="511" y="1075" class="mono" text-anchor="middle" fill="#8fe8e8">one latent</text>
  <text x="511" y="1093" class="chip3" text-anchor="middle">"jo dikh raha hai"</text>

  <rect x="606" y="1052" width="150" height="52" class="boxgood"/>
  <text x="681" y="1075" class="mono" text-anchor="middle" fill="#8fe8e8">world + goal</text>
  <text x="681" y="1093" class="chip3" text-anchor="middle">ek jagah</text>

  <rect x="776" y="1052" width="120" height="52" class="boxgood"/>
  <text x="836" y="1075" class="mono" text-anchor="middle" fill="#8fe8e8">action</text>
  <text x="836" y="1093" class="chip3" text-anchor="middle">+ words</text>
</g>
<line x1="416" y1="1078" x2="432" y2="1078" stroke="#22d3ee" stroke-width="1.6" marker-end="url(#acy)"/>
<line x1="586" y1="1078" x2="602" y2="1078" stroke="#22d3ee" stroke-width="1.6" marker-end="url(#acy)"/>
<line x1="756" y1="1078" x2="772" y2="1078" stroke="#22d3ee" stroke-width="1.6" marker-end="url(#acy)"/>

<rect x="266" y="1128" width="630" height="60" fill="#0f2b33" stroke="#22d3ee" stroke-width="1.2" rx="10"/>
<text x="581" y="1152" class="chip2" text-anchor="middle" fill="#7fd8e8">Koi alag "button detector" nahi. Koi hand-written rule nahi.</text>
<text x="581" y="1174" class="chip3" text-anchor="middle">Network khud seekhta hai ki button kya hai, text kya hai, aur kya karna hai.</text>

<rect x="266" y="1204" width="630" height="66" fill="#13242a" stroke="#2a7a7a" rx="10"/>
<text x="581" y="1230" class="chip2" text-anchor="middle" fill="#9fe8e8">Weights ek hi file. Trainer ek. Tokenizer ek.</text>
<text x="581" y="1252" class="chip3" text-anchor="middle">"Yeh model kaisa hai?" ka jawab ek number mein: params, loss, accuracy.</text>

<!-- 4 outputs -->
<g>
  <rect x="1010" y="966" width="336" height="78" class="boxgood"/>
  <text x="1030" y="1000" class="chip" fill="#7fe8e8">DEKHTA HAI</text>
  <text x="1030" y="1024" class="chip2">screen ka pura scene, ek nazar mein</text>

  <rect x="1010" y="1054" width="336" height="78" class="boxgood"/>
  <text x="1030" y="1088" class="chip" fill="#7fe8e8">SAMAJHTA HAI</text>
  <text x="1030" y="1112" class="chip2">kya likha hai, kaun sa app, kya ho raha</text>

  <rect x="1010" y="1142" width="336" height="78" class="boxgood"/>
  <text x="1030" y="1176" class="chip" fill="#7fe8e8">SOCHTA + KARTA HAI</text>
  <text x="1030" y="1200" class="chip2">agla kadam decide, phir mouse chalata</text>

  <rect x="1010" y="1230" width="336" height="78" class="boxgood"/>
  <text x="1030" y="1264" class="chip" fill="#7fe8e8">BOLTA HAI</text>
  <text x="1030" y="1288" class="chip2">aapko jawab deta hai, apne shabdon mein</text>
</g>
<g stroke="#22d3ee" stroke-width="1.8" fill="none">
  <path d="M918,1005 C970,1005 980,1005 1006,1005" marker-end="url(#acy)"/>
  <path d="M918,1093 C970,1093 980,1093 1006,1093" marker-end="url(#acy)"/>
  <path d="M918,1181 C970,1181 980,1181 1006,1181" marker-end="url(#acy)"/>
  <path d="M918,1269 C970,1269 980,1269 1006,1269" marker-end="url(#acy)"/>
</g>

<!-- caption -->
<rect x="238" y="1400" width="1108" height="112" fill="#0d2026" stroke="#1e5a5a" stroke-width="1.4" rx="12"/>
<text x="792" y="1436" class="cap" fill="#9fe8e8" text-anchor="middle" font-size="17">Farq ek hi line mein</text>
<text x="792" y="1464" class="chip2" text-anchor="middle" font-size="13.5">Aaj: 7 networks + 77 rules  →  koi "samajh" kisi ek jagah nahi.        Target: 1 network  →  samajh, soch aur kaam sab ek jagah, ek hi cheez.</text>
<text x="792" y="1492" class="chip3" text-anchor="middle">Yeh "button detector" nahi hai — yeh ek model hai jo duniya dekhta hai, jaise ek insaan.</text>

<!-- footer -->
<text x="60" y="1600" class="tiny">AVC v1 · aaj ka architecture: ~30 nn.Module classes, ~7 shipped checkpoints, 77 hand-written if/elif branches (avcs/observation.py 40, avcs/reasoning/provider.py 37)</text>
<text x="60" y="1624" class="tiny">Yeh diagram sapna aur sach dono dikhata hai: upar aaj ka code, neeche woh ek model jo aap chahte ho.</text>
</svg>
</body></html>
