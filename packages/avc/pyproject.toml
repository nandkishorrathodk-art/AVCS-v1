[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "avc"
version = "1.0.0"
description = "Artificial Visual Cortex (AVC) -- 1.14M Biomimetic Neural Network for Real-Time Screen Perception."
readme = "README.md"
authors = [
    { name = "Parth Labs", email = "contact@parthlabs.in" },
]
license = "Apache-2.0"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
keywords = [
    "avc",
    "artificial-visual-cortex",
    "screen-perception",
    "neural-network",
    "computer-use",
    "biological-vision",
    "predictive-coding",
    "affordance-detection",
]
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.22.0",
    "Pillow>=9.0.0",
    "cryptography>=3.4.0",
]

[project.optional-dependencies]
desktop = [
    "mss>=9.0.0",
]

[project.scripts]
avc = "avc.cli:main"

[project.urls]
Homepage = "https://github.com/Parth-labs-in/AVCS"
Repository = "https://github.com/Parth-labs-in/AVCS.git"

[tool.setuptools.packages.find]
where = ["."]
include = ["avc*"]

[tool.setuptools.package-data]
avc = ["py.typed", "weights/*.avcs", "weights/*.pt"]
